name: Refactor validation inputs
on:
  push:
    branches: [refactor/anime-api-v5-20261019]
    paths: [.github/workflows/refactor-validation-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Collect official API responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/validation/fixtures"
          export OUT="$RUNNER_TEMP/validation/fixtures"
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error,datetime
          from pathlib import Path
          root=Path(os.environ['OUT']); summary=[]
          ua='kiwi4814/HSC-Anime-Edition/5.0.0 (+https://github.com/kiwi4814/HSC-Anime-Edition)'
          def fetch(name,url,body=None):
              time.sleep(2.3)
              row={'name':name,'url':url,'fetched_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              try:
                  req=urllib.request.Request(url,data=data,headers={'User-Agent':ua,'Content-Type':'application/json','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=25) as res:
                      raw=res.read(2*1024*1024); row['status']=res.status
                      row['headers']={k:v for k,v in res.headers.items() if k.lower() in ('date','content-type','x-ratelimit-limit','x-ratelimit-remaining','retry-after')}
                  parsed=json.loads(raw); (root/(name+'.json')).write_text(json.dumps(parsed,ensure_ascii=False,indent=2))
              except Exception as e:
                  row['error']=type(e).__name__+': '+str(e)
              summary.append(row)
          for key,ident in [('eva',265),('fate',95225),('steel',1428),('gundam',1861)]:
              fetch('bangumi-'+key,'https://api.bgm.tv/v0/subjects/'+str(ident))
              fetch('bangumi-'+key+'-relations','https://api.bgm.tv/v0/subjects/'+str(ident)+'/subjects')
          fetch('bangumi-search','https://api.bgm.tv/v0/search/subjects?limit=10&offset=0',{'keyword':'Fate/stay night','sort':'match','filter':{'type':[2]}})
          fields='id type format episodes startDate { year } title { native romaji english } synonyms relations { edges { relationType(version:2) node { id type title { native romaji english } } } }'
          for key,ident in [('eva',30),('fate',19603),('steel',5114),('gundam',94)]:
              fetch('anilist-'+key,'https://graphql.anilist.co',{'query':'query($id:Int!) { Media(id:$id,type:ANIME) { '+fields+' } }','variables':{'id':ident}})
          (root/'provenance.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Prepare ephemeral Emby runtime, excluding all font files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/MediaBrowser/Emby.Releases/releases/download/4.10.1.0/emby-server-deb_4.10.1.0_amd64.deb -o "$RUNNER_TEMP/emby.deb"
          echo '9be753b074e8cf9d8874dabc82942e175feb6337aa9803da232c370172e905ed  '"$RUNNER_TEMP/emby.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/emby.deb" "$RUNNER_TEMP/validation/emby"
          find "$RUNNER_TEMP/validation/emby" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' -o -iname '*.ttc' \) -delete
          tar -C "$RUNNER_TEMP/validation" -czf "$RUNNER_TEMP/hsc-validation-inputs.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: hsc-validation-inputs
          path: ${{ runner.temp }}/hsc-validation-inputs.tar.gz
          retention-days: 1
          compression-level: 0
